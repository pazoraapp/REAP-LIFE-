<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REAP LIFE — Prayer</title><style>:root{--g:#245b45;--c:#f8f5ed;--m:#68766f}*{box-sizing:border-box}body{margin:0;background:var(--c);color:#24352d;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:850px;margin:auto;padding:18px 16px}.card{background:#fff;border:1px solid #e5dfd3;border-radius:20px;padding:22px;margin-top:14px}a{color:var(--g)}.eyebrow{color:var(--m);font-size:12px;font-weight:700;letter-spacing:.08em}.prayer{font-size:18px;line-height:1.75}</style></head><body><main class="wrap"><a href="./index.html">← REAP LIFE</a><div id="app" class="card">Loading…</div></main><script>const id=new URLSearchParams(location.search).get('id')||'PR-0001';fetch('./content/library.json').then(r=>r.json()).then(d=>{const x=d.content.find(a=>a.id===id&&a.type==='prayer');document.getElementById('app').innerHTML=x?`<p class="eyebrow">REAP LIFE PRAYER</p><h1>${x.title}</h1><p><b>Scripture:</b> ${x.scripture}</p><p class="prayer">${x.text}</p><p><a href="./message.html?id=${x.connectedMessage}">Return to connected message →</a></p>`:'<h2>Prayer not found</h2>'})</script></body></html>
