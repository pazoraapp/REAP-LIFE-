<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REAP LIFE — Content Entry</title><style>:root{--green:#245b45;--gold:#b89545;--cream:#f8f5ed;--ink:#24352d;--muted:#68766f;--line:#e4ded1;--red:#8a3b35}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{background:#fff;border-bottom:1px solid var(--line);padding:14px 16px;position:sticky;top:0;z-index:5}.bar{max-width:1050px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:46px;height:46px;object-fit:contain}.brand b{color:var(--green);letter-spacing:.08em}.brand small{display:block;color:var(--muted)}main{max-width:1050px;margin:auto;padding:18px 16px 60px}.notice{background:#fff8df;border:1px solid #eadcae;border-radius:14px;padding:12px 14px;margin-bottom:16px;font-size:13px}.grid{display:grid;grid-template-columns:330px 1fr;gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;background:var(--green);color:#fff}.btn.alt{background:#fff;color:var(--green);border:1px solid var(--green)}.btn.danger{background:var(--red);color:#fff}.item{padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer}.item.active{border:2px solid var(--green)}.item b{display:block}.item small{color:var(--muted)}.status{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;margin-top:6px;background:#eee}.approved{background:#dcefe4;color:#245b45}.draft{background:#f4e8d2;color:#76551e}.ready{background:#e1e9f4;color:#315477}.scheduled{background:#eadff0;color:#613e73}.published{background:#dcefe4;color:#245b45}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fields{display:grid;gap:10px}label{font-size:12px;font-weight:800}input,textarea,select{width:100%;padding:11px;border:1px solid #d8d2c6;border-radius:10px;background:#fff;font:inherit}textarea{min-height:110px;resize:vertical}.check{display:flex;gap:9px;align-items:flex-start;padding:7px 0;font-size:13px}.check input{width:auto;margin-top:3px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.warning{border:1px solid #e4b8a9;background:#fff0ec;border-radius:12px;padding:10px;font-size:13px;margin-top:8px}.good{border:1px solid #b8d8c3;background:#eff9f2;border-radius:12px;padding:10px;font-size:13px;margin-top:8px}.muted{color:var(--muted);font-size:12px}.pill{display:inline-block;background:#f1eee6;padding:4px 7px;border-radius:8px;margin:2px;font-size:11px}@media(max-width:780px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
</style></head><body><header><div class="bar"><div class="brand"><img src="./assets/reap-life-logo.png"><div><b>REAP LIFE</b><small>Content Entry & Review</small></div></div><a class="btn alt" href="./admin.html">Content Desk</a></div></header><main><div class="notice"><strong>Pastoral control:</strong> this V1 entry desk is local-only. It helps you build and review the ministry library without editing code. Production use will later require secure accounts, a database and audit trail.</div><div class="grid"><section class="panel"><div class="toolbar"><button class="btn" onclick="newContent()">＋ New Content</button><button class="btn alt" onclick="exportData()">Export</button><button class="btn alt" onclick="importData()">Import</button></div><input id="filter" placeholder="Search title, topic, Scripture or ID" oninput="renderList()"><div id="list" style="margin-top:12px"></div></section><section class="panel"><h2 id="heading">New Content</h2><div id="form"></div></section></div></main><script>
const seed={messages:[{id:'RL-0001',title:'The Danger of Seeking Comfort Outside of God',topic:'Oh God, Comfort Me',speaker:'Pastor Mayowa John',primaryScripture:'Ruth 1:1–5',supportingScriptures:['Genesis 13:10–11','Genesis 19:15–17'],type:'Sermon',category:'Life Challenges / Comfort',audience:['General'],tags:['comfort','life challenges'],status:'Draft',description:'A message on where we turn when life becomes painful, and the danger of seeking lasting comfort outside God.',lifeMemoId:'LM-0001',prayerId:'PR-0001',audioId:'',videoId:'',shortVideoId:'',audioUrl:'',videoUrl:'',shortVideoUrl:'',scheduledDate:'',lastPreached:'',lastUsed:'',review:{passage:true,context:false,interpretation:false,supporting:false,application:false,doctrine:false,pastor:false}}]};
let data=JSON.parse(localStorage.getItem('reapLifeLibrary')||'null')||seed;let selected=-1;
const types=['Sermon','Short Word','Bible Teaching','Devotional','Prayer','Gospel','Testimony','Exhortation','Christian Living','Discipleship'];
const audiences=['General','Youth','Women','Men','Children','Professionals','Leaders','New Believers','Non-Christians'];
function save(){localStorage.setItem('reapLifeLibrary',JSON.stringify(data));renderList();renderForm()}
function newContent(){data.messages=data.messages||[];const n=data.messages.length+1;data.messages.push({id:'RL-'+String(n).padStart(4,'0'),title:'',topic:'',speaker:'Pastor Mayowa John',primaryScripture:'',supportingScriptures:[],type:'Sermon',category:'',audience:['General'],tags:[],status:'Draft',description:'',lifeMemoId:'',prayerId:'',audioId:'',videoId:'',shortVideoId:'',audioUrl:'',videoUrl:'',shortVideoUrl:'',scheduledDate:'',lastPreached:'',lastUsed:'',review:{passage:false,context:false,interpretation:false,supporting:false,application:false,doctrine:false,pastor:false}});selected=data.messages.length-1;save()}
function renderList(){const q=(document.getElementById('filter')?.value||'').toLowerCase();const el=document.getElementById('list');const arr=(data.messages||[]).map((m,i)=>({m,i})).filter(x=>JSON.stringify(x.m).toLowerCase().includes(q));el.innerHTML=arr.map(x=>{const m=x.m;return `<div class="item ${x.i===selected?'active':''}" onclick="selectMsg(${x.i})"><b>${esc(m.title||'Untitled content')}</b><small>${esc(m.id)} · ${esc(m.type||'Content')}</small><br><span class="status ${String(m.status||'Draft').toLowerCase()}">${esc(m.status||'Draft')}</span></div>`}).join('')||'<p class="muted">No matching content.</p>'}
function selectMsg(i){selected=i;renderList();renderForm()}
function renderForm(){const el=document.getElementById('form');if(selected<0){document.getElementById('heading').textContent='New Content';el.innerHTML='<p class="muted">Tap <strong>＋ New Content</strong> to create a message/content record.</p>';return}const m=data.messages[selected];document.getElementById('heading').textContent=(m.id||'Content')+' — '+(m.title||'New Content');el.innerHTML=`<div class="fields"><div class="row"><div><label>Content ID</label><input id="id" value="${esc(m.id)}"></div><div><label>Status</label><select id="status">${['Draft','Ready','Approved','Scheduled','Published','Archived'].map(x=>`<option>${x}</option>`).join('')}</select></div></div><div><label>Title</label><input id="title" value="${esc(m.title)}" placeholder="Enter the main message title"></div><div class="row"><div><label>Topic</label><input id="topic" value="${esc(m.topic)}"></div><div><label>Category</label><input id="category" value="${esc(m.category)}" placeholder="e.g. Life Challenges / Comfort"></div></div><div class="row"><div><label>Speaker</label><input id="speaker" value="${esc(m.speaker)}"></div><div><label>Content Type</label><select id="type">${types.map(x=>`<option>${x}</option>`).join('')}</select></div></div><div><label>Primary Bible Text</label><input id="primary" value="${esc(m.primaryScripture)}" placeholder="e.g. Ruth 1:1–5"></div><div><label>Supporting Bible Texts</label><input id="support" value="${esc((m.supportingScriptures||[]).join('; '))}" placeholder="Separate references with semicolons"></div><div><label>Audience</label><div>${audiences.map(a=>`<label class="check" style="display:inline-flex;margin-right:10px"><input type="checkbox" class="aud" value="${a}" ${(m.audience||[]).includes(a)?'checked':''}>${a}</label>`).join('')}</div></div><div><label>Tags</label><input id="tags" value="${esc((m.tags||[]).join(', '))}" placeholder="comfort, prayer, restoration"></div><div><label>Description / Summary</label><textarea id="description">${esc(m.description||'')}</textarea></div><hr><h3>Connect the Ministry Experiences</h3><div class="row"><div><label>Life Memo ID</label><input id="lifeMemoId" value="${esc(m.lifeMemoId||'')}" placeholder="LM-0001"></div><div><label>Prayer ID</label><input id="prayerId" value="${esc(m.prayerId||'')}" placeholder="PR-0001"></div></div><div class="row"><div><label>Audio ID / file reference</label><input id="audioId" value="${esc(m.audioId||'')}"></div><div><label>Full Video ID / link reference</label><input id="videoId" value="${esc(m.videoId||'')}"></div></div><div><label>Short Video ID / link reference</label><input id="shortVideoId" value="${esc(m.shortVideoId||'')}"></div><div class="row"><div><label>Audio URL</label><input id="audioUrl" value="${esc(m.audioUrl||'')}" placeholder="https://…/audio.mp3"></div><div><label>Full Video URL</label><input id="videoUrl" value="${esc(m.videoUrl||'')}" placeholder="YouTube or direct video URL"></div></div><div><label>Short Video URL</label><input id="shortVideoUrl" value="${esc(m.shortVideoUrl||'')}"></div><hr><h3>Schedule & Usage</h3><div class="row"><div><label>Scheduled publication date</label><input id="scheduledDate" type="date" value="${esc(m.scheduledDate||'')}"></div><div><label>Last preached</label><input id="lastPreached" type="date" value="${esc(m.lastPreached||'')}"></div></div><div><label>Last used anywhere in REAP LIFE</label><input id="lastUsed" type="date" value="${esc(m.lastUsed||'')}"></div><div id="usageBox"></div><hr><h3>Scripture Review</h3>${check('passage','Passage correctly referenced/quoted',m.review?.passage)}${check('context','Immediate context examined',m.review?.context)}${check('interpretation','Interpretation is consistent with context',m.review?.interpretation)}${check('supporting','Supporting Scriptures properly related',m.review?.supporting)}${check('application','Interpretation separated from application',m.review?.application)}${check('doctrine','No unsupported doctrinal claim',m.review?.doctrine)}${check('pastor','Pastor/ministry approval completed',m.review?.pastor)}<div id="warnings"></div><div class="actions"><button class="btn" onclick="saveContent()">Save Content</button><button class="btn alt" onclick="markReady()">Mark Ready</button><button class="btn" onclick="approve()">Approve</button><button class="btn danger" onclick="removeContent()">Delete</button></div></div>`;document.getElementById('status').value=m.status||'Draft';document.getElementById('type').value=m.type||'Sermon';updateWarnings();document.querySelectorAll('input,select,textarea').forEach(x=>x.addEventListener('input',updateWarnings));document.querySelectorAll('.check input').forEach(x=>x.addEventListener('change',updateWarnings))}
function check(k,label,val){return `<label class="check"><input type="checkbox" id="c_${k}" ${val?'checked':''}> <span>${label}</span></label>`}
function collect(){const m=data.messages[selected];m.id=v('id');m.title=v('title');m.topic=v('topic');m.category=v('category');m.speaker=v('speaker');m.type=v('type');m.primaryScripture=v('primary');m.supportingScriptures=v('support').split(';').map(x=>x.trim()).filter(Boolean);m.audience=[...document.querySelectorAll('.aud:checked')].map(x=>x.value);m.tags=v('tags').split(',').map(x=>x.trim()).filter(Boolean);m.description=v('description');m.lifeMemoId=v('lifeMemoId');m.prayerId=v('prayerId');m.audioId=v('audioId');m.videoId=v('videoId');m.shortVideoId=v('shortVideoId');m.audioUrl=v('audioUrl');m.videoUrl=v('videoUrl');m.shortVideoUrl=v('shortVideoUrl');m.scheduledDate=v('scheduledDate');m.lastPreached=v('lastPreached');m.lastUsed=v('lastUsed');m.status=document.getElementById('status').value;m.review={};['passage','context','interpretation','supporting','application','doctrine','pastor'].forEach(k=>m.review[k]=document.getElementById('c_'+k).checked)}
function saveContent(){collect();save();alert('Content saved to the local library.')}function markReady(){collect();data.messages[selected].status='Ready';save();alert('Marked Ready for review.')}function approve(){collect();const m=data.messages[selected];const ok=Object.values(m.review).every(Boolean);if(!ok){alert('Approval is blocked until all seven Scripture Review items are complete.');renderForm();return}m.status='Approved';save();alert('Approved. This content can now enter scheduling/automatic selection.')}function removeContent(){if(confirm('Delete this content record from the local prototype?')){data.messages.splice(selected,1);selected=-1;save()}}
function updateWarnings(){if(selected<0)return;const m=data.messages[selected];const all=data.messages||[];const today=new Date();const warnings=[];const primary=vSafe('primary');const title=vSafe('title');const topic=vSafe('topic');const sameTitle=all.filter((x,i)=>i!==selected&&title&&x.title?.trim().toLowerCase()===title.toLowerCase());const sameText=all.filter((x,i)=>i!==selected&&primary&&x.primaryScripture?.trim().toLowerCase()===primary.toLowerCase());const sameTopic=all.filter((x,i)=>i!==selected&&topic&&x.topic?.trim().toLowerCase()===topic.toLowerCase());if(sameTitle.length)warnings.push('A content record already has this title.');if(sameText.length)warnings.push('This exact primary Bible text already appears in another content record. Check whether it is a deliberate related use.');if(sameTopic.length)warnings.push('This topic already exists in another content record.');const lp=vSafe('lastPreached');if(lp){const days=Math.floor((today-new Date(lp+'T00:00:00'))/86400000);if(days>=0&&days<30)warnings.push(`Recently preached: ${days} day${days===1?'':'s'} ago.`)}const lu=vSafe('lastUsed');if(lu){const days=Math.floor((today-new Date(lu+'T00:00:00'))/86400000);if(days>=0&&days<30)warnings.push(`Recently used in REAP LIFE: ${days} day${days===1?'':'s'} ago.`)}const box=document.getElementById('warnings');box.innerHTML=warnings.length?'<div class="warning"><strong>Review warnings</strong><br>'+warnings.map(esc).join('<br>')+'</div>':'<div class="good"><strong>No obvious title/text/topic/usage warning detected in this local library.</strong></div>';document.getElementById('usageBox').innerHTML=`<p class="muted">Usage indicators are advisory. They do not automatically prevent pastoral use.</p>`}
function vSafe(id){const x=document.getElementById(id);return x?x.value.trim():''}function v(id){return document.getElementById(id).value.trim()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function exportData(){const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(data,null,2));a.download='reap-life-library.json';a.click()}function importData(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=()=>{const r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);selected=-1;save();alert('Library imported.')}catch(e){alert('Invalid library file.')}};r.readAsText(input.files[0])};input.click()}
renderList();renderForm();
</script></body></html>
